[package]
name = "hisyo-view"
version = "0.1.0"
description = "HISYO VIEW"
authors = ["coil398"]
license = "MIT"
edition = "2021"

[lib]
name = "hisyo_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "sync", "time"] }
